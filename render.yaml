services:
  - name: handforge
    type: web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: >
      npm install --prefix server &&
      npm run generate --prefix server &&
      npm install --prefix web && npm run build --prefix web &&
      npm install --prefix poker &&
      npm install --prefix hub &&
      npm run db:push --prefix server
    startCommand: npm run start --prefix hub
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # Общий секрет для PhotoQuest (server/) и Poker (poker/server.js) —
      # оба процесса живут в одном контейнере и читают одну и ту же
      # переменную окружения, поэтому единый вход работает без доп. настройки.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Postgres (например Neon, бесплатный план) — Render free не даёт
      # постоянный диск, SQLite не переживёт рестарт контейнера.
      - key: DATABASE_URL
        sync: false
      # Ключ ИИ для проверки фото — Anthropic ИЛИ OpenRouter, минимум один.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Попыток на одно задание — по умолчанию в коде 3, увеличено по просьбе
      # (некоторые задания некорректно строгие, снимку нужно больше попыток).
      - key: MAX_ATTEMPTS_PER_ASSIGNMENT
        value: 10
      # Порог риск-очков для автобана антифродом — по умолчанию в коде было
      # 70 (легко срабатывало на активных игроках/тестах), подняли по просьбе.
      - key: BAN_RISK_THRESHOLD
        value: 150
      # Фото — на локальном диске контейнера (STORAGE_DRIVER=local по
      # умолчанию, см. server/src/config.js). Диск Render free эфемерный:
      # после сна/передеплоя старые фото пропадают, но очки/аккаунты (они в
      # Neon) не затрагиваются — осознанный компромисс для бесплатного хостинга.
      # Заполнить публичным доменом сервиса после первого деплоя
      # (например https://handforge.onrender.com или свой домен).
      - key: CORS_ORIGIN
        sync: false
