<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="vign" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1a1508" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#08080f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4d989"/>
      <stop offset="50%" stop-color="#c8972f"/>
      <stop offset="100%" stop-color="#8a641c"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#vign)"/>

  <!-- геральдический щит-водяной знак, еле заметный -->
  <g transform="translate(800 560)" opacity="0.05" stroke="url(#gold)" stroke-width="3" fill="none">
    <path d="M0 -420 L260 -340 L260 -40 Q260 220 0 400 Q-260 220 -260 -40 L-260 -340 Z"/>
    <path d="M0 -380 L225 -308 L225 -50 Q225 175 0 340 Q-225 175 -225 -50 L-225 -308 Z"/>
  </g>

  <!-- звёздная пыль: мелкие золотые крапинки, как текстура на логотипе -->
  <g fill="#f4d989">
    <circle cx="80" cy="120" r="1.4" opacity="0.5"/>
    <circle cx="220" cy="60" r="1" opacity="0.35"/>
    <circle cx="150" cy="260" r="1.6" opacity="0.4"/>
    <circle cx="340" cy="180" r="1" opacity="0.3"/>
    <circle cx="60" cy="420" r="1.3" opacity="0.4"/>
    <circle cx="410" cy="90" r="1.5" opacity="0.45"/>
    <circle cx="480" cy="340" r="1" opacity="0.3"/>
    <circle cx="260" cy="480" r="1.4" opacity="0.35"/>
    <circle cx="1520" cy="140" r="1.5" opacity="0.45"/>
    <circle cx="1380" cy="70" r="1" opacity="0.3"/>
    <circle cx="1450" cy="280" r="1.6" opacity="0.4"/>
    <circle cx="1250" cy="200" r="1" opacity="0.3"/>
    <circle cx="1550" cy="420" r="1.3" opacity="0.4"/>
    <circle cx="1180" cy="100" r="1.4" opacity="0.45"/>
    <circle cx="1120" cy="360" r="1" opacity="0.3"/>
    <circle cx="1320" cy="460" r="1.5" opacity="0.35"/>
    <circle cx="700" cy="850" r="1.4" opacity="0.35"/>
    <circle cx="900" cy="900" r="1" opacity="0.3"/>
    <circle cx="500" cy="780" r="1.3" opacity="0.3"/>
    <circle cx="1100" cy="820" r="1.5" opacity="0.35"/>
  </g>

  <!-- тонкая золотая линия-рамка, как двойной кант на логотипе -->
  <rect x="24" y="24" width="1552" height="952" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.12"/>
  <rect x="34" y="34" width="1532" height="932" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.08"/>
</svg>
